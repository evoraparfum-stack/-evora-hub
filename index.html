<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EVORA Tracker MVP</title>

<style>
body{
font-family:Arial,sans-serif;
background:#111;
color:#fff;
padding:15px;
}

.card{
background:#1d1d1d;
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

h1{
text-align:center;
letter-spacing:6px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:6px;
margin-bottom:6px;
border:none;
border-radius:8px;
box-sizing:border-box;
}

button{
font-weight:bold;
cursor:pointer;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
background:#222;
padding:12px;
border-radius:10px;
text-align:center;
}

.value{
font-size:22px;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:8px;
border-bottom:1px solid #333;
text-align:left;
}
.action-btn{
width:auto;
padding:6px 10px;
margin:2px;
font-size:12px;
}

.edit-btn{
background:#f59e0b;
color:white;
}

<button
class="reset-btn"
onclick="resetSemua()">
Reset Semua Data
</button>
</style>
</head>

<body>

<h1>EVORA</h1>

<div class="card">
<h3>Dashboard</h3>

<div class="stats">

<div class="stat">
<div class="value" id="totalProduk">0</div>
<div>Produk</div>
</div>

<div class="stat">
<div class="value" id="totalStok">0</div>
<div>Stok</div>
</div>

</div>

<br>
<label>Pilih Bulan</label>

<input
type="month"
id="bulanFilter">
<div class="stat">
Omzet Bulan Ini
<br><br>
<b id="omzet">Rp 0</b>
</div>

<br>

<div class="stat">
Pengeluaran Bulan Ini
<br><br>
<b id="pengeluaran">Rp 0</b>
</div>

<br>

<div class="stat">
Laba Bulan Ini
<br><br>
<b id="laba">Rp 0</b>
</div>

</div>

<div class="card">
<h3>Harga Global</h3>

<input
id="hargaGlobal"
type="number"
placeholder="35000">

<button onclick="simpanHarga()">
Simpan Harga
</button>

<button onclick="resetSemua()">
Reset Semua Data
</button>
</div>

<div class="card">
<h3>Tambah Produk</h3>

<input
id="namaProduk"
placeholder="Nama Produk">

<input
id="stokProduk"
type="number"
placeholder="Stok">

<button onclick="tambahProduk()">
Tambah Produk
</button>

</div>

<div class="card">
<h3>Penjualan</h3>

<select id="channel">
<option>Shopee</option>
<option>TikTok Shop</option>
</select>

<select id="produkJual">
</select>

<input
id="qtyJual"
type="number"
placeholder="Qty">

<button onclick="simpanPenjualan()">
Simpan Penjualan
</button>

</div>

<div class="card">
<h3>Pengeluaran</h3>

<select id="kategori">
<option>Iklan TikTok</option>
<option>Iklan Shopee</option>
<option>Botol</option>
<option>Box</option>
<option>Bibit</option>
<option>Stiker</option>
<option>Lainnya</option>
</select>

<input
id="nominal"
type="number"
placeholder="Nominal">

<button onclick="simpanPengeluaran()">
Simpan Pengeluaran
</button>

</div>

<div class="card">
<h3>Daftar Produk</h3>

<table>
<thead>
<tr>
<th>Produk</th>
<th>Stok</th> <th>Aksi</th>>
</tr>
</thead>

<tbody id="produkList">
</tbody>

</table>
</div>

<script>

let produk =
JSON.parse(
localStorage.getItem("evora_produk")
|| "[]"
);

let penjualan =
JSON.parse(
localStorage.getItem("evora_penjualan")
|| "[]"
);

let pengeluaranData =
JSON.parse(
localStorage.getItem("evora_pengeluaran")
|| "[]"
);

let hargaGlobal =
Number(
localStorage.getItem("evora_harga")
|| 35000
);

document.getElementById("hargaGlobal").value =
hargaGlobal;
document.getElementById(
"bulanFilter"
).value =
new Date()
.toISOString()
.slice(0,7);
function save(){

localStorage.setItem(
"evora_produk",
JSON.stringify(produk)
);

localStorage.setItem(
"evora_penjualan",
JSON.stringify(penjualan)
);

localStorage.setItem(
"evora_pengeluaran",
JSON.stringify(pengeluaranData)
);

}

function simpanHarga(){

hargaGlobal =
Number(
document.getElementById("hargaGlobal").value
);

localStorage.setItem(
"evora_harga",
hargaGlobal
);

render();

}

function tambahProduk(){

const nama =
document.getElementById("namaProduk").value;

const stok =
Number(
document.getElementById("stokProduk").value
);

if(!nama)return;

produk.push({
nama:nama,
stok:stok
});

save();
render();

}

function simpanPenjualan(){

const index =
document.getElementById("produkJual").value;

const qty =
Number(
document.getElementById("qtyJual").value
);

if(qty<=0)return;

if(produk[index].stok < qty){

alert("Stok tidak cukup");
return;

}

produk[index].stok -= qty;

penjualan.push({

tanggal:
new Date()
.toISOString()
.slice(0,10),

channel:
document.getElementById("channel").value,

produk:
produk[index].nama,

qty:qty,

total:
qty * hargaGlobal

});

save();
render();

}

function simpanPengeluaran(){

const nominal =
Number(
document.getElementById("nominal").value
);

if(nominal<=0)return;

pengeluaranData.push({

tanggal:
new Date()
.toISOString()
.slice(0,10),

kategori:
document.getElementById("kategori").value,

nominal:nominal

});

save();
render();

}
function editProduk(index){

let namaBaru = prompt(
"Nama Produk Baru",
produk[index].nama
);

if(namaBaru){

produk[index].nama = namaBaru;

save();
render();

}

}

function hapusProduk(index){

if(confirm("Hapus produk ini?")){

produk.splice(index,1);

save();
render();

}

}
function resetSemua(){

if(!confirm(
"Yakin ingin menghapus SEMUA data?"
)){
return;
}

produk = [];
penjualan = [];
pengeluaranData = [];

localStorage.removeItem("evora_produk");
localStorage.removeItem("evora_penjualan");
localStorage.removeItem("evora_pengeluaran");

render();

alert("Semua data berhasil dihapus");

}
function render(){

document.getElementById("totalProduk").innerText =
produk.length;

let totalStok = 0;

produk.forEach(p=>{
totalStok += p.stok;
});

document.getElementById("totalStok").innerText =
totalStok;

let produkHTML = "";
let optionHTML = "";

produk.forEach((p,index)=>{

produkHTML += `
<tr>

<td>${p.nama}</td>

<td>${p.stok}</td>

<td>

<button
class="action-btn edit-btn"
onclick="editProduk(${index})">
Edit
</button>

<button
class="action-btn delete-btn"
onclick="hapusProduk(${index})">
Hapus
</button>

</td>

</tr>
`;

optionHTML += `
<option value="${index}">
${p.nama}
</option>
`;

});

document.getElementById("produkList").innerHTML =
produkHTML;

document.getElementById("produkJual").innerHTML =
optionHTML;

let omzet = 0;
let pengeluaran = 0;

const bulanDipilih =
document.getElementById(
"bulanFilter"
).value;

penjualan.forEach(x=>{

if(
x.tanggal.startsWith(
bulanDipilih
)
){
omzet += x.total;
}

});

pengeluaranData.forEach(x=>{

if(
x.tanggal.startsWith(
bulanDipilih
)
){
pengeluaran += x.nominal;
}

});

document.getElementById("omzet").innerText =
"Rp " + omzet.toLocaleString("id-ID");

document.getElementById("pengeluaran").innerText =
"Rp " + pengeluaran.toLocaleString("id-ID");

document.getElementById("laba").innerText =
"Rp " + (omzet-pengeluaran)
.toLocaleString("id-ID");

}

render();
document
.getElementById(
"bulanFilter"
)
.addEventListener(
"change",
render
);

render();
</script>

</body>
</html>
